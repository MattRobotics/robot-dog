## Development policy

- `main` is the only active branch in `robot-dog` after milestone cleanup.
- New calibration development starts from the current merged architecture.
- At most one clearly named active calibration branch should exist while a milestone is under development.
- Temporary version-numbered workflows and branches must be removed after closeout.
- Closed PRs preserve historical experiments; obsolete branches are not retained as operational choices.
- Public documentation must describe MATDOG itself and must not expose unrelated private research material.

---

Built and documented by Matt Robotics.
'''

          verification = r'''# MATDOG repository verification index

**Scope:** canonical remote state after LF V25 closeout and repository cleanup.

## Current sources of truth

```text
MattRobotics/robot-dog
  active branch: main
  role: public MATDOG project source of truth

MattRobotics/norma-core
  active development branch: main
  immutable validated release: release/matdog-lf-calibrator-v25
  reviewed V25 source head: f87dd1fbc7e8100d275c74f9af448642f3429680
```

## Validation status

```text
LF V25: hardware validated, affine profile saved, EEPROM frozen
RF: not yet hardware validated
RH: not yet hardware validated
LH: not yet hardware validated
complete all-leg calibration: not yet validated
```

No V28–V42 or “all legs” experimental implementation is a current program. Future leg work must start from merged `norma-core/main` and generalize the proven V25 architecture through data-driven leg profiles.

## Canonical records

```text
README.md
06_Software/Matdog_Core/calibration/MATDOG_LF_CALIBRATION_V25_FINAL.md
09_Logs/Development_Log/2026-08-04_LF_V25_AND_REPOSITORY_CLEANUP.md
```

## Repository hygiene policy

- `robot-dog` retains only `main` as an active remote branch after cleanup.
- `norma-core` retains only `main` and `release/matdog-lf-calibrator-v25` after cleanup.
- Closed pull requests preserve the historical audit trail.
- Failed, cancelled, incomplete and superseded workflow runs may be deleted.
- Only successful V25 evidence and durable current CI are retained.
- Private external research material is excluded from the public MATDOG baseline.
'''

          cleanup_log = r'''# MATDOG repository cleanup and LF V25 closeout

**Date:** 2026-08-04  
**Status:** final remote closeout

## Result

The LF V25 milestone is complete and frozen. Repository presentation has been consolidated around the actual validated state:

```text
LF V25: validated on hardware
RF/RH/LH: not yet mechanically calibrated
all-leg persistent profile: not yet complete
```

## Canonical refs

```text
robot-dog/main
norma-core/main
norma-core/release/matdog-lf-calibrator-v25
```

The release branch preserves the exact reviewed LF V25 source. Future-leg development starts from merged `norma-core/main` and must not rewrite the release branch.

## Historical development

Superseded versioned experiments remain available through their closed pull requests as audit history. Their remote working branches and temporary workflow definitions are not retained as operational choices.

## Workflow policy

Only durable current CI and successful LF V25 evidence are retained. Failed, cancelled, incomplete, duplicate and superseded workflow runs may be removed from GitHub Actions.

## Public repository policy

`robot-dog` documents MATDOG itself. Unrelated private research sources are excluded from the public repository, documentation and machine-readable baseline.

## Next milestone

```text
generalize merged V25 architecture to RF
→ supervised RF six-contact calibration
→ RF affine gate
→ transactional RF freeze
```
'''

          Path('README.md').write_text(readme, encoding='utf-8')
          Path('REPOSITORY_VERIFICATION_INDEX.md').write_text(verification, encoding='utf-8')
          Path('09_Logs/Development_Log/2026-08-04_LF_V25_AND_REPOSITORY_CLEANUP.md').write_text(cleanup_log, encoding='utf-8')

          final_record = Path('06_Software/Matdog_Core/calibration/MATDOG_LF_CALIBRATION_V25_FINAL.md')
          text = final_record.read_text(encoding='utf-8')
          old = '''## 8. Next milestone

```text
merge NormaCore PR #11
→ preserve release/matdog-lf-calibrator-v25
→ generalize V25 to RF without changing LF evidence
→ supervised RF six-contact calibration
→ RF affine gate and transactional freeze
```
'''
          new = '''## 8. Next milestone

NormaCore PR #11 and the post-merge workflow cleanup PR #12 are complete. The exact LF V25 source remains frozen on `release/matdog-lf-calibrator-v25`.

```text
generalize merged V25 architecture to RF without changing LF evidence
→ supervised RF six-contact calibration
→ RF affine gate and transactional freeze
```
'''
          if old not in text:
              raise SystemExit('Expected LF final-record milestone block not found')
          final_record.write_text(text.replace(old, new), encoding='utf-8')

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          brand = 'xgo' + 'lite'
          replacements = [
              ('MattRobotics/' + brand + '-low-level-reconstruction', 'private external research reference'),
              (brand + '-low-level-reconstruction', 'private-external-reference'),
              ('XGo' + 'Lite', 'PrivateReference'),
              ('XGo' + ' Lite', 'PrivateReference'),
              ('xgo' + '_lite', 'private_reference'),
              ('xgo' + '-lite', 'private-reference'),
              (brand, 'private_reference'),
          ]

          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode('utf-8'))
              if not path.is_file() or path.as_posix() == '.github/workflows/public-repository-cleanup-v25.yml':
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original
              for source, replacement in replacements:
                  updated = updated.replace(source, replacement)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')

          Path('.github/workflows/public-repository-cleanup-v25.yml').unlink()
          PY

      - name: Validate public repository result
        shell: bash
        run: |
          git diff --check
          if git grep -niE 'xgo[ _-]*lite|xgolite' -- ':!*.png' ':!*.jpg' ':!*.jpeg'; then
            echo 'Private research identifier remains in tracked public files.' >&2
            exit 1
          fi
          grep -F '**LF only: V25 hardware validated and frozen**' README.md
          grep -F 'complete all-leg calibration: not yet validated' REPOSITORY_VERIFICATION_INDEX.md
          test ! -e .github/workflows/public-repository-cleanup-v25.yml

      - name: Commit cleanup result to pull-request branch
        shell: bash
        run: |
          git config user.name 'MattRobotics Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'docs(repo): restore project overview and redact private research references'
          git push origin HEAD:${{ github.head_ref }}
