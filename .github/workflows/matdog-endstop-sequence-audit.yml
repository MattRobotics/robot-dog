name: MATDOG Ordered Endstop Geometry Audit

on:
  push:
    branches:
      - matdog/calibration-sequence-upper-lower-hip-audit
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/matdog-endstop-sequence-audit.yml"
      - "06_Software/Matdog_Core/calibration/MATDOG_ENDSTOP_SEQUENCE_REDESIGN_2026-07-30.md"
      - "06_Software/Matdog_Core/calibration/MATDOG_ENDSTOP_SEQUENCE_REDESIGN_ADDENDUM_2026-07-30.md"
      - "06_Software/Matdog_Core/calibration/MATDOG_CALIBRATION_FIXTURE.example.yaml"
      - "06_Software/Matdog_Core/calibration/matdog_endstop_sequence_geometry_audit.py"
      - "06_Software/Matdog_Core/calibration/matdog_endstop_sequence_geometry_audit_v2.py"
      - "06_Software/Matdog_Core/calibration/matdog_endstop_sequence_geometry_audit_v3.py"
      - "06_Software/Matdog_Core/calibration/matdog_endstop_session_oracle.py"
      - "06_Software/Matdog_Core/calibration/test_matdog_endstop_session_oracle.py"
      - "03_CAD/URDF/matt_robodog_rev00/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matdog-ordered-endstop-geometry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  geometry-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head including LFS meshes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Verify branch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          for path in \
            06_Software/Matdog_Core/calibration/MATDOG_ENDSTOP_SEQUENCE_REDESIGN_2026-07-30.md \
            06_Software/Matdog_Core/calibration/MATDOG_ENDSTOP_SEQUENCE_REDESIGN_ADDENDUM_2026-07-30.md \
            06_Software/Matdog_Core/calibration/MATDOG_CALIBRATION_FIXTURE.example.yaml \
            06_Software/Matdog_Core/calibration/matdog_endstop_sequence_geometry_audit.py \
            06_Software/Matdog_Core/calibration/matdog_endstop_sequence_geometry_audit_v2.py \
            06_Software/Matdog_Core/calibration/matdog_endstop_sequence_geometry_audit_v3.py \
            06_Software/Matdog_Core/calibration/matdog_endstop_session_oracle.py \
            06_Software/Matdog_Core/calibration/test_matdog_endstop_session_oracle.py; do
            test -f "$path"
          done

      - name: Install exact-mesh collision dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfcl-dev
          python3 -m pip install --disable-pip-version-check \
            numpy==2.3.2 \
            trimesh==4.7.1 \
            python-fcl==0.7.0.8 \
            PyYAML==6.0.2

      - name: Syntax, import, and mesh inventory gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-output
          python3 -m py_compile \
            06_Software/Matdog_Core/calibration/matdog_endstop_sequence_geometry_audit.py \
            06_Software/Matdog_Core/calibration/matdog_endstop_sequence_geometry_audit_v2.py \
            06_Software/Matdog_Core/calibration/matdog_endstop_sequence_geometry_audit_v3.py \
            06_Software/Matdog_Core/calibration/matdog_endstop_session_oracle.py \
            06_Software/Matdog_Core/calibration/test_matdog_endstop_session_oracle.py
          python3 - <<'PY' | tee ci-output/mesh-inventory.log
          from pathlib import Path
          import fcl
          import trimesh

          print('python-fcl:', getattr(fcl, '__version__', 'loaded'))
          print('trimesh:', trimesh.__version__)
          root = Path('03_CAD/URDF/matt_robodog_rev00/meshes')
          files = sorted(root.glob('*.stl'))
          assert files, 'no STL collision meshes found'
          for path in files:
              mesh = trimesh.load_mesh(path, process=False)
              if isinstance(mesh, trimesh.Scene):
                  mesh = mesh.dump(concatenate=True)
              vertices = len(getattr(mesh, 'vertices', ()))
              faces = len(getattr(mesh, 'faces', ()))
              print(f'{path.name}: bytes={path.stat().st_size} vertices={vertices} faces={faces}')
              assert vertices > 0 and faces > 0, f'empty mesh: {path}'
          print(f'mesh_count={len(files)}')
          PY

      - name: Ordered session and detector oracle regressions
        shell: bash
        working-directory: 06_Software/Matdog_Core/calibration
        run: |
          set -o pipefail
          python3 -m unittest -v test_matdog_endstop_session_oracle.py \
            2>&1 | tee ../../../ci-output/ordered-session-oracle.log
          grep -q 'Ran 8 tests' ../../../ci-output/ordered-session-oracle.log
          grep -q '^OK$' ../../../ci-output/ordered-session-oracle.log

      - name: Exact URDF mesh audit — UPPER then LOWER then HIP
        shell: bash
        run: |
          set -o pipefail
          python3 06_Software/Matdog_Core/calibration/matdog_endstop_sequence_geometry_audit_v3.py \
            --repo-root "$PWD" \
            --output ci-output/ordered-sequence-self-collision.json \
            2>&1 | tee ci-output/ordered-sequence-self-collision.log
          grep -q '"result": "PASS"' ci-output/ordered-sequence-self-collision.json
          grep -q 'ordered-upper-lower-hip-mesh-envelope-v2' ci-output/ordered-sequence-self-collision.json
          grep -q '"UPPER_MIN_MAX"' ci-output/ordered-sequence-self-collision.json
          grep -q '"LOWER_MIN_MAX"' ci-output/ordered-sequence-self-collision.json
          grep -q '"HIP_MIN_MAX"' ci-output/ordered-sequence-self-collision.json
          test "$(grep -c '"final_home": true' ci-output/ordered-sequence-self-collision.json)" = 4

      - name: Hardware certification must block without measured fixture
        shell: bash
        run: |
          set -euo pipefail
          if python3 06_Software/Matdog_Core/calibration/matdog_endstop_sequence_geometry_audit_v3.py \
              --repo-root "$PWD" --certify-hardware \
              >ci-output/no-fixture.stdout 2>ci-output/no-fixture.stderr; then
            echo 'audit unexpectedly certified hardware without fixture' >&2
            exit 1
          fi
          grep -q 'hardware certification requires --fixture' ci-output/no-fixture.stderr

      - name: Placeholder fixture must also block
        shell: bash
        run: |
          set -euo pipefail
          if python3 06_Software/Matdog_Core/calibration/matdog_endstop_sequence_geometry_audit_v3.py \
              --repo-root "$PWD" \
              --fixture 06_Software/Matdog_Core/calibration/MATDOG_CALIBRATION_FIXTURE.example.yaml \
              --certify-hardware \
              >ci-output/placeholder.stdout 2>ci-output/placeholder.stderr; then
            echo 'audit unexpectedly certified placeholder fixture' >&2
            exit 1
          fi
          grep -q 'fixture box is still a placeholder' ci-output/placeholder.stderr

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matdog-ordered-endstop-geometry-audit
          path: ci-output/
          if-no-files-found: error
