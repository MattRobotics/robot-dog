servo:
  vendor: Feetech
  variant: ST-3215-C018
  model_register:
    address: "0x03"
    width: 2
    expected_value: 777
    note: >
      The C018 exposes its model word at 0x03. NormaCore's
      software/drivers/st3215/src/protocol/memory.rs declares ModelNumber at 0x00;
      for the C018 that is a source-map defect and must not be used for identity gating.
      Defect still open upstream; tracked as a dependency risk.

