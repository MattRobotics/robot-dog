<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1014" />
    <title>MATDOG Twin</title>
    <style>
      :root { color-scheme: dark; --bg:#0d1014; --panel:#151a20; --line:#2a323c; --text:#e6e9ed; --muted:#9aa4ad; --ok:#4ade80; --warn:#fbbf24; --bad:#e5484d; --info:#36dcdf; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
      #app { display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; }
      header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
      header a { color: var(--info); margin-left: auto; }
      .chip { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; white-space: nowrap; }
      .chip.ok { border-color: var(--ok); color: var(--ok); } .chip.warn { border-color: var(--warn); color: var(--warn); }
      .chip.bad { border-color: var(--bad); color: var(--bad); } .chip.info { border-color: var(--info); color: var(--info); }
      #viewport { position: relative; min-height: 0; }
      #viewport canvas { display: block; width: 100%; height: 100%; }
      #banner { position: absolute; left: 12px; right: 12px; top: 10px; padding: 6px 10px; border-radius: 6px; background: #222a33cc; font-size: 13px; }
      #panel { max-height: 38dvh; overflow: auto; padding: 8px 12px 12px; border-top: 1px solid var(--line); background: var(--panel); }
      dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 0; }
      dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
      pre { font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; margin: 8px 0 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <strong>MATDOG Twin</strong>
        <span id="chip-link" class="chip">LINK —</span>
        <span id="chip-imu" class="chip">IMU —</span>
        <span id="chip-joints" class="chip">GIUNTI —</span>
        <span id="chip-raw" class="chip">RAW —</span>
        <a href="/">Dashboard · STOP</a>
      </header>
      <div id="viewport"><div id="banner">Caricamento modello…</div></div>
      <section id="panel" aria-live="polite">
        <dl id="facts"></dl>
        <pre id="joints"></pre>
      </section>
    </div>
    <script type="module" src="/src/mobile/mobileMain.ts"></script>
  </body>
</html>
